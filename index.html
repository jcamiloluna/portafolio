<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para mi Trébol 🍀</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Georgia, serif;
            background: linear-gradient(135deg, #ffe0ec, #e8d5ff, #d6f5e3);
            overflow: hidden;
            padding: 20px;
        }

        .carta {
            background: rgba(255, 255, 255, 0.85);
            padding: 40px 25px;
            border-radius: 25px;
            text-align: center;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            animation: aparecer 1.2s ease;
            z-index: 1;
        }

        .trebol {
            font-size: 55px;
            margin-bottom: 15px;
            animation: latido 2s infinite;
        }

        h1 {
            color: #d94f83;
            font-size: 30px;
            margin-bottom: 15px;
        }

        .mensaje {
            color: #594558;
            font-size: 17px;
            line-height: 1.8;
        }

        .corazon {
            color: #e879a9;
            font-size: 22px;
            margin-top: 20px;
        }

        .firma {
            color: #9c79b8;
            font-size: 14px;
            margin-top: 25px;
            font-style: italic;
        }

        .flotante {
            position: fixed;
            bottom: -30px;
            animation: flotar 7s linear forwards;
            pointer-events: none;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes latido {
            50% {
                transform: scale(1.12);
            }
        }

        @keyframes flotar {
            to {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="carta">
        <div class="trebol">🍀</div>

        <h1>Para mi Trébol</h1>

        <p class="mensaje">
            Esta es mi primera página web.
            <br><br>
            Quiero aprender, crecer y lograr muchas cosas...
            y qué bonito sería compartir mis logros contigo. ❤️
        </p>

        <div class="corazon">♡ ✧ ♡</div>

        <div class="firma">
            Un pequeño detalle para ti. 💗
        </div>
    </div>

    <script>
        function crearCorazon() {
            const corazon = document.createElement("div");
            corazon.className = "flotante";

            const simbolos = ["❤️", "💕", "🍀", "✨"];
            corazon.textContent =
                simbolos[Math.floor(Math.random() * simbolos.length)];

            corazon.style.left = Math.random() * 100 + "vw";
            corazon.style.fontSize = (15 + Math.random() * 15) + "px";
            corazon.style.animationDuration = (5 + Math.random() * 4) + "s";

            document.body.appendChild(corazon);

            setTimeout(() => corazon.remove(), 9000);
        }

        setInterval(crearCorazon, 700);
    </script>

</body>
</html>
